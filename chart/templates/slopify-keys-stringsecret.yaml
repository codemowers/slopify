apiVersion: secretgenerator.mittwald.de/v1alpha1
kind: StringSecret
metadata:
  name: slopify-keys
  labels:
    skaffold.dev/keep: "true"
spec:
  forceRegenerate: false
  fields:
    - fieldName: session-key
      encoding: hex
      length: "64"
    - fieldName: stream-signing-key
      encoding: hex
      length: "64"
