{{- if .Values.networkPolicy.enabled }}
# Internal HTTP calls are allowed between Slopify services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slopify-internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: slopify
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: slopify
      ports:
        - port: http
{{- end }}
