apiVersion: apps/v1
kind: Deployment
metadata:
  name: slopify-indexer
  labels: &labels
    app.kubernetes.io/name: slopify
    app.kubernetes.io/component: indexer
spec:
  replicas: 1
  # Two indexers must never write sidecars at once.
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . | quote }}
      {{- end }}
      securityContext:
        # The host media directory must allow UID/GID 1000 to write sidecars.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: indexer
          image: "{{ if .Values.imageRepository }}{{ .Values.imageRepository }}/{{ end }}{{ .Values.images.indexer }}"
          env:
            - name: MEDIA_ROOT
              value: /media
            # Leave headroom for concurrent ffprobe subprocesses.
            - name: GOMEMLIMIT
              value: 128MiB
            - name: INDEXER_PROBE_WORKERS
              value: "2"
            - name: METRICS_LISTEN_ADDR
              value: {{ printf ":%v" .Values.indexer.metrics.port | quote }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: {{ .Values.indexer.metrics.port }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: media
              mountPath: /media
      volumes:
        - name: media
          {{- if .Values.media.hostPath }}
          hostPath:
            path: {{ .Values.media.hostPath | quote }}
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ default "slopify-media" .Values.media.existingClaim | quote }}
          {{- end }}
