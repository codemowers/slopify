apiVersion: apps/v1
kind: Deployment
metadata:
  name: slopify-streamer
  labels: &labels
    app.kubernetes.io/name: slopify
    app.kubernetes.io/component: streamer
spec:
  replicas: 1
  # Pods mount the node-local media volume; replace them rather than overlap.
  strategy:
    type: Recreate
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: streamer
          image: "{{ if .Values.imageRepository }}{{ .Values.imageRepository }}/{{ end }}{{ .Values.images.streamer }}"
          env:
            - name: MEDIA_ROOT
              value: /media
            - name: STREAM_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: slopify-keys
                  key: stream-signing-key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: media
              mountPath: /media
              readOnly: true
      volumes:
        - name: media
          {{- if .Values.media.hostPath }}
          hostPath:
            path: {{ .Values.media.hostPath | quote }}
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ default "slopify-media" .Values.media.existingClaim | quote }}
          {{- end }}
