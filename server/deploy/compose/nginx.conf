pid /tmp/nginx.pid;
events {}
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen [::]:8080 ipv6only=off;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_buffering off;
    proxy_read_timeout 1h;
    location /api/catalog { proxy_pass http://127.0.0.1:18082; }
    location = /api/me { proxy_pass http://127.0.0.1:18085; }
    location /api/ { proxy_pass http://127.0.0.1:18083; }
    location /device { proxy_pass http://127.0.0.1:18083; }
    location /stream/original { proxy_pass http://127.0.0.1:18084; }
    location /stream/video- { proxy_pass http://127.0.0.1:18086; }
    location /stream/opus-128 { proxy_pass http://127.0.0.1:18087; }
    location /stream/mp3-192 { proxy_pass http://127.0.0.1:18088; }
    location / { proxy_pass http://127.0.0.1:18085; }
  }
}
