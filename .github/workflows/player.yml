name: Player binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  binary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, goarch: amd64 }
          - { name: linux-386, goarch: "386" }
          - { name: linux-arm64, goarch: arm64 }
          - { name: linux-armv7, goarch: arm, goarm: "7" }
          - { name: linux-armv6, goarch: arm, goarm: "6" }
          - { name: linux-mips-softfloat, goarch: mips, gomips: softfloat }
          - { name: linux-mipsle-softfloat, goarch: mipsle, gomips: softfloat }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build static player
        run: go build -trimpath -ldflags='-s -w' -o "dist/slopify-player-$TARGET" ./player
        env:
          TARGET: ${{ matrix.name }}
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-player-${{ matrix.name }}
          path: dist/slopify-player-${{ matrix.name }}
          if-no-files-found: error
