# Two slopify-player devices without sound hardware (null output) that
# connect through the public HTTPS address like real devices. Test only.
apiVersion: secretgenerator.mittwald.de/v1alpha1
kind: StringSecret
metadata:
  name: slopify-testplayer-tokens
spec:
  forceRegenerate: false
  fields:
    - fieldName: token-a
      encoding: hex
      length: "64"
    - fieldName: token-b
      encoding: hex
      length: "64"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slopify-testplayers
  labels: &labels
    app.kubernetes.io/name: slopify-testplayers
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: player-a
          image: slopify-player
          env:
            - name: SLOPIFY_SERVER
              value: https://slopify.example.com
            - name: SLOPIFY_NAME
              value: Demo player A
            - name: SLOPIFY_OUTPUT
              value: "null"
            - name: SLOPIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slopify-testplayer-tokens
                  key: token-a
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            readOnlyRootFilesystem: true
        - name: player-b
          image: slopify-player
          env:
            - name: SLOPIFY_SERVER
              value: https://slopify.example.com
            - name: SLOPIFY_NAME
              value: Demo player B
            - name: SLOPIFY_OUTPUT
              value: "null"
            - name: SLOPIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slopify-testplayer-tokens
                  key: token-b
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            readOnlyRootFilesystem: true
