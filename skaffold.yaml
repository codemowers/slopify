apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: slopify
build:
  tagPolicy:
    inputDigest: {}
  local:
    push: true
  artifacts:
    - image: slopify-indexer
      docker:
        dockerfile: server/build/indexer.Dockerfile
    - image: slopify-catalog
      docker:
        dockerfile: server/build/catalog.Dockerfile
    - image: slopify-streamer
      docker:
        dockerfile: server/build/streamer.Dockerfile
    - image: slopify-players
      docker:
        dockerfile: server/build/players.Dockerfile
    - image: slopify-frontend
      docker:
        dockerfile: server/build/frontend.Dockerfile
    - image: slopify-transcoder
      docker:
        dockerfile: server/build/transcoder.Dockerfile
manifests:
  helm:
    flags:
      template:
        # Local Helm rendering doesn't discover CRDs.
        - --api-versions=monitoring.coreos.com/v1/PodMonitor
    releases:
      - name: slopify
        chartPath: chart
        valuesFiles:
          - chart/values-local.yaml
        setValueTemplates:
          images.indexer: "{{.IMAGE_FULLY_QUALIFIED_slopify_indexer}}"
          images.catalog: "{{.IMAGE_FULLY_QUALIFIED_slopify_catalog}}"
          images.streamer: "{{.IMAGE_FULLY_QUALIFIED_slopify_streamer}}"
          images.players: "{{.IMAGE_FULLY_QUALIFIED_slopify_players}}"
          images.transcoder: "{{.IMAGE_FULLY_QUALIFIED_slopify_transcoder}}"
          images.frontend: "{{.IMAGE_FULLY_QUALIFIED_slopify_frontend}}"
deploy:
  # Context and namespace come from the local, gitignored skaffold.env.
  kubectl:
    flags:
      delete:
        - --selector=skaffold.dev/keep!=true

profiles:
  - name: demo
    build:
      platforms: [linux/amd64]
    patches:
      - op: replace
        path: /manifests/helm/releases/0/valuesFiles
        value:
          - chart/demo.yaml
          - chart/values-demo.yaml
      - op: add
        path: /manifests/helm/releases/0/namespace
        value: demo
    deploy:
      kubeContext: admin@ee-lte-1.codemowers.io
      statusCheckDeadlineSeconds: 600
      kubectl:
        defaultNamespace: demo
